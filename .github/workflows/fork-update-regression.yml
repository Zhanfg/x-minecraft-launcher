name: Fork P0 update regression

on:
  pull_request:
    paths:
      - '.github/workflows/fork-update-regression.yml'
      - 'xmcl-runtime/fork/**'
      - 'packages/instance/**'
      - 'xmcl-runtime/instanceIO/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: P0 fixture, delta and progressive recovery regression
        run: pnpm vitest run xmcl-runtime/fork/instance-update-regression.test.ts packages/instance/files_delta.test.ts xmcl-runtime/instanceIO/InstanceInstallService.progressive.test.ts
